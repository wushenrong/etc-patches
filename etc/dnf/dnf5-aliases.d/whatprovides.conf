version = "1.1"

["whatprovides"]
type = "command"
attached_command = "repoquery"
descr.C = "Alias for 'repoquery --installed --whatprovides=<package>'"
complete = true

[[whatprovides.required_values]]
value_help.C = "CAPABILITY,..."
descr.C = "Limit to packages that provide any of <capabilities>."

[[whatdepends.attached_named_args]]
id_path = "repoquery.installed"

[[whatprovides.attached_named_args]]
id_path = "repoquery.whatprovides"
value="${1}"
